name: Docker Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64          # AMD64 for servers, ARM64 for Mac M1/M2/M3
          push: ${{ github.event_name == 'push' }}   # only push on merge to main, not on PRs
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/stock-predictor:latest
            ${{ secrets.DOCKER_USERNAME }}/stock-predictor:${{ github.sha }}
          cache-from: type=gha                        # GitHub Actions layer cache
          cache-to:   type=gha,mode=max